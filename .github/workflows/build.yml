name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # The app and Icon Composer assets require the macOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(uname -m)" = arm64
      - name: Cache the pinned upstream disk image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/upstream/*.dmg
          key: kdeconnect-arm64-${{ hashFiles('Scripts/kdeconnect-version.env') }}
      - name: Test
        run: |
          swift test
          bash Tests/Scripts/build-app-tests.sh
      - name: Package app with pre-built KDE Connect
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: Scripts/package-release.sh
      - name: Verify packaged app
        run: Scripts/verify-release.sh
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KDE-Connect-Native-macos-arm64
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: KDE-Connect-Native-macos-arm64
          path: release
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --prerelease \
            --title "KDE Connect Native $RELEASE_TAG" \
            --notes-file .github/RELEASE_NOTES.md
